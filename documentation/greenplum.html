<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Greenplum SQL Documentation</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        pre {
            margin: 0;
            border-radius: 5px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #4CAF50;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        #sql-frame {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← Back to Home</a>
        <h1>Greenplum SQL Documentation</h1>
        <pre><code id="sql-content" class="language-sql"></code></pre>
    </div>
    <iframe id="sql-frame" src="greenplum.sql"></iframe>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <script>
        // Load SQL file using iframe
        window.addEventListener('load', function() {
            const iframe = document.getElementById('sql-frame');
            iframe.onload = function() {
                try {
                    const content = iframe.contentDocument.body.textContent;
                    const codeElement = document.getElementById('sql-content');
                    codeElement.textContent = content;
                    Prism.highlightElement(codeElement);
                } catch(e) {
                    // Fallback: create a direct link
                    const codeElement = document.getElementById('sql-content');
                    codeElement.textContent = 'Unable to load with syntax highlighting.\nClick here to view the file directly: ';
                    const link = document.createElement('a');
                    link.href = 'greenplum.sql';
                    link.textContent = 'greenplum.sql';
                    link.target = '_blank';
                    codeElement.appendChild(link);
                }
            };
        });
    </script>
</body>
</html>
